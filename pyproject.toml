[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "usbpd-c2-epr-pyclient"
version = "1.6.1.2"
description = "GRLPS C2-EPR automation client - drive the GRL Platform Solutions USB-PD C2-EPR application over its local HTTP API."
readme = "README.md"
# Kept in step with _MIN_PYTHON in the facade, so pip and the import-time check
# agree. The wheel is pure Python, so one build covers every listed version.
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "GRL Platform Solutions" }]
keywords = ["grlps", "grl", "usb-pd", "c2-epr", "epr", "test-automation"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = ["requests>=2.25.0"]

[project.scripts]
c2epr-init = "grlps_api_client._bootstrap:main"
c2epr-testcases = "grlps_api_client._cli:testcases"
c2epr-run = "grlps_api_client._cli:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["grlps_api_client*"]

[tool.setuptools.package-data]
grlps_api_client = [
    "config/*.json",
    "user_interaction/vif/*",
    "user_interaction/test_cases_list/*",
    "docs/*.md",
]
